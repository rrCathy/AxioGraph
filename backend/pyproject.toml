[project]
name = "axiograph-backend"
version = "0.1.0"
description = "AxioGraph - Math Knowledge Graph Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pymupdf>=1.24.0",
    "openai>=1.55.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "aiofiles>=24.1.0",
    "json-repair>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
